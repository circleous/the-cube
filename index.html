<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,height=device-height,user-scalable=no,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0"
    />

    <title>The Cube - A Rubik's Cube Game</title>

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="The Cube" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="translucent-black" />

    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png" />
    <link rel="manifest" href="assets/icons/site.webmanifest" />
    <link rel="mask-icon" href="assets/icons/safari-pinned-tab.svg" color="#5bbad5" />
    <link rel="shortcut icon" href="assets/icons/favicon.ico" />
    <meta name="theme-color" content="#ffffff" />

    <link rel="stylesheet" type="text/css" href="/src/scss/styles.sass" />

    <script>
      window.gameVersion = '0.100.0';
    </script>
  </head>
  <body>
    <div class="ui">
      <div class="ui__background"></div>

      <div class="ui__game"></div>

      <div class="ui__texts">
        <h1 class="text text--title">
          <span>THE</span>
          <span>CUBE</span>
        </h1>
        <div class="text text--note">Double tap to start</div>
        <div class="text text--timer">0:00</div>
        <div class="text text--complete">
          <span>Complete!</span>
        </div>
        <div class="text text--best-time">
          <icon trophy></icon>
          <span>Best Time!</span>
        </div>
      </div>

      <div class="ui__keys">
        <span class="keys__group">
          <button type="button" class="keys__key" data-key="R"><kbd>R</kbd></button>
          <button type="button" class="keys__key" data-key="L"><kbd>L</kbd></button>
          <button type="button" class="keys__key" data-key="U"><kbd>U</kbd></button>
          <button type="button" class="keys__key" data-key="D"><kbd>D</kbd></button>
          <button type="button" class="keys__key" data-key="F"><kbd>F</kbd></button>
          <button type="button" class="keys__key" data-key="B"><kbd>B</kbd></button>
          <i>Turn</i>
        </span>
        <span class="keys__group">
          <button type="button" class="keys__key" data-key="shift" aria-pressed="false">
            <kbd>Shift</kbd>
          </button>
          <i>Reverse</i>
        </span>
        <span class="keys__group">
          <button type="button" class="keys__key" data-key="x"><kbd>X</kbd></button>
          <button type="button" class="keys__key" data-key="y"><kbd>Y</kbd></button>
          <button type="button" class="keys__key" data-key="z"><kbd>Z</kbd></button>
          <i>Rotate</i>
        </span>
      </div>

      <div class="ui__prefs"></div>

      <div class="ui__theme"></div>

      <div class="ui__stats">
        <div class="stats" name="cube-size"><i>Cube:</i><b>3x3x3</b></div>
        <div class="stats" name="total-solves"><i>Total solves:</i><b>-</b></div>
        <div class="stats" name="best-time"><i>Best time:</i><b>-</b></div>
        <div class="stats" name="worst-time"><i>Worst time:</i><b>-</b></div>
        <div class="stats" name="average-5"><i>Average of 5:</i><b>-</b></div>
        <div class="stats" name="average-12"><i>Average of 12:</i><b>-</b></div>
        <div class="stats" name="average-25"><i>Average of 25:</i><b>-</b></div>
      </div>

      <div class="ui__buttons">
        <button class="btn btn--bl btn--stats">
          <icon trophy></icon>
        </button>
        <button class="btn btn--br btn--prefs">
          <icon settings></icon>
        </button>
        <button class="btn btn--bl btn--back">
          <icon back></icon>
        </button>
        <button class="btn btn--br btn--theme">
          <icon theme></icon>
        </button>
        <button class="btn btn--br btn--reset">
          <icon reset></icon>
        </button>
      </div>
    </div>

    <script type="module" src="/src/js/Game.js"></script>
  </body>
</html>
